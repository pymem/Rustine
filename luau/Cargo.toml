[package]
name = "rustine-luau"
version = "0.1.0"
edition = "2021"
description = "Minimal Luau source -> bytecode compiler for Rustine (no execution, no memory access)"
license = "MIT"
repository = "https://github.com/rustine/rustine"

[dependencies]
mlua = { version = "0.11", default-features = false, features = ["luau", "compiler"] }
